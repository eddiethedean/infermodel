[package]
name = "infermodel"
version = "0.1.0"
edition = "2021"
description = "Rust core for schema inference from sequence of mappings"
license = "MIT"

[lib]
name = "infermodel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
