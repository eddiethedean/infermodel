[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "infermodel"
version = "0.1.0"
description = "Rust-backed schema inference from Iterable[Mapping] with Pydantic model emission"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "infermodel contributors" }]
keywords = ["schema", "inference", "pydantic", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/infermodel"
Repository = "https://github.com/eddiethedean/infermodel"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]
pandas = [
    "pandas>=2.2",
]
parquet = [
    "pyarrow>=15.0",
]
adapters = [
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[tool.maturin]
module-name = "infermodel._infermodel"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["target", ".venv"]
line-length = 88

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
